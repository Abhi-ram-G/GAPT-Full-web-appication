services:
  - type: web
    name: gapt-full-web-appication
    env: python
    pythonVersion: "3.11.9"
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend
      gunicorn core.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        value: your-secret-key
      - key: DB_ENGINE
        value: django.db.backends.mysql
      - key: DB_NAME
        value: "<set in Render secrets>"
      - key: DB_USER
        value: "<set in Render secrets>"
      - key: DB_PASSWORD
        value: "<set in Render secrets>"
      - key: DB_HOST
        value: "<set in Render secrets>"
      - key: DB_PORT
        value: "<set in Render secrets>"
      - key: DB_SSL_MODE
        value: "<set in Render secrets>"
